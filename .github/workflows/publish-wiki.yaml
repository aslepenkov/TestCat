name: Publish wiki

on:
  workflow_dispatch:
  push:
    branches: [dev] # Triggered when changes are pushed to the dev branch
    paths:
      - wiki/** # Only changes in the wiki folder
      - .github/workflows/publish-wiki.yml

concurrency:
  group: publish-wiki
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: Andrew-Chen-Wang/github-wiki-action@v4
